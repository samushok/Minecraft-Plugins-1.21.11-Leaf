name: MogRitual CI

on:
  push:
    branches:
      - feature/mog-ritual
      - main
    paths:
      - 'source/MogRitual/**'
      - '.github/workflows/mog-ritual-ci.yml'
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Leaf 1.21.11 build 179
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-leaf
          cd .ci-leaf
          curl -fL --retry 3 -o leaf.jar             https://api.leafmc.one/v2/projects/leaf/versions/1.21.11/builds/179/downloads/leaf-1.21.11-179.jar
          echo 'eula=true' > eula.txt
          java -Xms512M -Xmx1G -jar leaf.jar nogui > bootstrap.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' bootstrap.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat bootstrap.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat bootstrap.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          SERVER_JAR="$(find versions/1.21.11 -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$SERVER_JAR"
          echo "SERVER_JAR=$PWD/$SERVER_JAR" >> "$GITHUB_ENV"
          echo "LIBRARIES_DIR=$PWD/libraries" >> "$GITHUB_ENV"

      - name: Compile MogRitual
        shell: bash
        run: |
          set -euo pipefail
          python3 source/MogRitual/build.py             --server "$SERVER_JAR"             --libraries "$LIBRARIES_DIR"
          test -f source/MogRitual/build/MogRitual-1.5.1-Leaf-1.21.11.jar

      - name: Validate low-load design and config
        shell: bash
        run: |
          set -euo pipefail
          JAR=source/MogRitual/build/MogRitual-1.5.1-Leaf-1.21.11.jar
          jar tf "$JAR" | grep -q 'me/saminasian/mogritual/MogRitualPlugin.class'
          jar tf "$JAR" | grep -q 'plugin.yml'
          jar tf "$JAR" | grep -q 'config.yml'

          ! grep -R -q 'ArmorStand' source/MogRitual/src/main/java
          grep -q 'ItemDisplay' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'TextDisplay' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java

          unzip -p "$JAR" config.yml > /tmp/mog-config.yml
          grep -q 'phrase: "я тебя могну"' /tmp/mog-config.yml
          grep -q 'required-players: 2' /tmp/mog-config.yml
          grep -q 'window-seconds: 12' /tmp/mog-config.yml
          grep -q 'seconds: 21600' /tmp/mog-config.yml
          ! grep -q '^roulette:' /tmp/mog-config.yml
          grep -q 'config-version: 9' /tmp/mog-config.yml
          grep -q 'scope: "PLAYER"' /tmp/mog-config.yml
          grep -q 'start: "SUCCESS"' /tmp/mog-config.yml
          grep -q 'execute-reward-commands: true' /tmp/mog-config.yml
          grep -q 'strip-ending-punctuation: true' /tmp/mog-config.yml
          grep -q 'accept-cancelled-chat: true' /tmp/mog-config.yml
          grep -q 'AMETHYST_BLOCK' /tmp/mog-config.yml
          grep -q 'PURPUR_BLOCK' /tmp/mog-config.yml
          grep -q 'SEA_LANTERN' /tmp/mog-config.yml
          grep -q 'player-animation:' /tmp/mog-config.yml
          grep -q 'camera:' /tmp/mog-config.yml
          grep -q 'duration-ticks: 100' /tmp/mog-config.yml
          grep -q 'custom-key: "mogritual:ya_tebya_mognu"' /tmp/mog-config.yml
          grep -q 'value: "✦ Я ТЕБЯ МОГНУ ✦"' /tmp/mog-config.yml
          grep -q '^resource-pack:' /tmp/mog-config.yml
          grep -q 'require-for-ritual: false' /tmp/mog-config.yml
          grep -q 'send-on-join: true' /tmp/mog-config.yml
          grep -q 'enabled: true' /tmp/mog-config.yml

          test -f source/MogRitual/resource-pack-template/pack.mcmeta
          test -f source/MogRitual/resource-pack-template/assets/mogritual/sounds.json
          grep -q '"ya_tebya_mognu"' source/MogRitual/resource-pack-template/assets/mogritual/sounds.json

          grep -q 'for (int index = 0; index < 3; index++)' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'cleanupDance(dance)' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'ClientboundSetCameraPacket' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'restoreCamera(player)' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'entity.setViewRange(1.5f);' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'private boolean executeReward' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'Reward command returned false' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'IOException | IllegalArgumentException' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'reward-failed:' /tmp/mog-config.yml
          grep -q '^pre-ritual-countdown:' /tmp/mog-config.yml
          grep -q 'title: "ДО МОГ РИТУАЛА"' /tmp/mog-config.yml
          grep -q 'two-text: "%seconds% СЕКУНДЫ"' /tmp/mog-config.yml
          grep -q '^winner-result:' /tmp/mog-config.yml
          grep -q '^winner-case:' /tmp/mog-config.yml
          grep -q 'duration-ticks: 60' /tmp/mog-config.yml
          grep -q 'private void startWinnerCase' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'ThreadLocalRandom.current().nextBoolean()' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'private void startCaseOpening' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'private void cleanupCase' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'private void playWinnerCelebration' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'PlayerQuitEvent' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'resourcePackStatuses.remove(event.getPlayer().getUniqueId())' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'StandardCopyOption.ATOMIC_MOVE' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'winner-case.execute-reward-commands' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          grep -q 'winner.getWorld() != caseWorld' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          ! grep -q 'private void startRoulette' source/MogRitual/src/main/java/me/saminasian/mogritual/MogRitualPlugin.java
          unzip -p "$JAR" plugin.yml | grep -q "version: '1.5.1-Leaf-1.21.11'"
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'paperweight-mappings-namespace: mojang'

          ! grep -R -q 'AsyncPlayerChatEvent' source/MogRitual/src/main/java

      - name: Prepare old v2 config migration test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-leaf/plugins/MogRitual
          printf 'broken=\\uZZZZ\n' > .ci-leaf/plugins/MogRitual/cooldown.properties
          cat > .ci-leaf/plugins/MogRitual/config.yml <<'EOF'
          config-version: 2
          general:
            enabled: true
          trigger:
            phrase: "я тебя могну"
            required-players: 4
            window-seconds: 12
            accept-cancelled-chat: false
            ignore-case: true
          cooldown:
            seconds: 21600
            scope: "PLAYER"
            start: "SUCCESS"
            persist: true
          roulette:
            enabled: true
            reward-mode: "EACH"
            execute-reward-commands: false
          rewards:
            test:
              enabled: true
              display-name: "TEST"
              weight: 1.0
              chance: 100.0
              commands:
                - "CONSOLE:say test"
          EOF

      - name: Smoke boot on Leaf and verify migration
        shell: bash
        run: |
          set -euo pipefail
          cp source/MogRitual/build/MogRitual-1.5.1-Leaf-1.21.11.jar .ci-leaf/plugins/
          cd .ci-leaf
          rm -f logs/latest.log mog-smoke.log

          java -Xms512M -Xmx1G -jar leaf.jar nogui > mog-smoke.log 2>&1 &
          pid=$!
          enabled=0
          for _ in $(seq 1 90); do
            if grep -q 'MogRitual enabled for Leaf / Paper 1.21.11' mog-smoke.log logs/latest.log 2>/dev/null \
              && grep -q 'MogRitual configuration validation passed' mog-smoke.log logs/latest.log 2>/dev/null; then
              enabled=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat mog-smoke.log
              exit 1
            fi
            sleep 1
          done

          if [ "$enabled" -ne 1 ]; then
            cat mog-smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          if grep -E -q 'Could not load.*MogRitual|Error occurred while enabling MogRitual|Exception.*MogRitual' mog-smoke.log logs/latest.log 2>/dev/null; then
            cat mog-smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          grep -q 'Migrated MogRitual config to v3: chat-controller compatibility enabled.' mog-smoke.log logs/latest.log
          grep -q 'Migrated MogRitual config to v4: dance visuals added.' mog-smoke.log logs/latest.log
          grep -q 'Migrated MogRitual config to v5: cinematic camera and ritual audio added.' mog-smoke.log logs/latest.log
          grep -q 'Migrated MogRitual config to v6: managed ritual resource-pack support added.' mog-smoke.log logs/latest.log
          grep -q 'Migrated MogRitual config to v7: default ritual duration synchronized to 5 seconds.' mog-smoke.log logs/latest.log
          grep -q 'Migrated MogRitual config to v8: 2-second countdown and 50/50 winner case added.' mog-smoke.log logs/latest.log
          grep -q 'Migrated MogRitual config to v9: fixed two-player flow and removed legacy roulette settings.' mog-smoke.log logs/latest.log
          grep -q 'Could not load cooldown.properties; starting with an empty cooldown state' mog-smoke.log logs/latest.log
          grep -q 'config-version: 9' plugins/MogRitual/config.yml
          grep -q 'accept-cancelled-chat: true' plugins/MogRitual/config.yml
          grep -q 'lyric-actionbar:' plugins/MogRitual/config.yml
          grep -q 'Я тебя могну' plugins/MogRitual/config.yml
          grep -q 'AMETHYST_BLOCK' plugins/MogRitual/config.yml
          grep -q 'mogritual:ya_tebya_mognu' plugins/MogRitual/config.yml
          grep -q 'duration-ticks: 100' plugins/MogRitual/config.yml
          grep -q '^pre-ritual-countdown:' plugins/MogRitual/config.yml
          grep -q '^winner-case:' plugins/MogRitual/config.yml
          grep -q 'required-players: 2' plugins/MogRitual/config.yml
          grep -q 'execute-reward-commands: false' plugins/MogRitual/config.yml
          ! grep -q '^roulette:' plugins/MogRitual/config.yml
          grep -q '^resource-pack:' plugins/MogRitual/config.yml
          grep -q 'send-on-join: true' plugins/MogRitual/config.yml

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: MogRitual-1.5.1-Leaf-1.21.11
          path: source/MogRitual/build/MogRitual-1.5.1-Leaf-1.21.11.jar
          if-no-files-found: error
