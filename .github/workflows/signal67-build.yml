name: Build and Smoke Test Signal67

on:
  push:
    branches:
      - feature/signal-67
    paths:
      - 'source/Signal67/**'
      - '.github/workflows/signal67-build.yml'
  workflow_dispatch:

concurrency:
  group: signal67-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Signal67
        working-directory: source/Signal67
        run: gradle clean build --stacktrace

      - name: Validate JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=source/Signal67/build/libs/Signal67-1.0-Leaf-1.21.11.jar
          test -f "$JAR"

          jar tf "$JAR" > /tmp/signal67-jar.txt
          grep -q 'me/saminasian/signal67/Signal67Plugin.class' /tmp/signal67-jar.txt
          grep -q 'plugin.yml' /tmp/signal67-jar.txt
          grep -q 'config.yml' /tmp/signal67-jar.txt

          unzip -p "$JAR" plugin.yml > /tmp/signal67-plugin.yml
          unzip -p "$JAR" config.yml > /tmp/signal67-config.yml

          grep -q '^name: Signal67$' /tmp/signal67-plugin.yml
          grep -q "main: me.saminasian.signal67.Signal67Plugin" /tmp/signal67-plugin.yml
          grep -q "api-version: '1.21'" /tmp/signal67-plugin.yml
          grep -q '^  signal67:$' /tmp/signal67-plugin.yml
          grep -q '^trigger: "67"$' /tmp/signal67-config.yml
          grep -q '^cooldown-seconds: 3600$' /tmp/signal67-config.yml
          grep -q '^rewards:$' /tmp/signal67-config.yml

      - name: Prepare Leaf 1.21.11 build 179
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-leaf
          cd .ci-leaf

          curl -fL --retry 3 -o leaf.jar \
            https://api.leafmc.one/v2/projects/leaf/versions/1.21.11/builds/179/downloads/leaf-1.21.11-179.jar

          echo 'eula=true' > eula.txt

          java -Xms512M -Xmx1G -jar leaf.jar nogui > bootstrap.log 2>&1 &
          pid=$!
          ready=0

          for _ in $(seq 1 120); do
            if grep -q 'Done (' bootstrap.log 2>/dev/null; then
              ready=1
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              cat bootstrap.log
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Leaf bootstrap did not become ready.'
            cat bootstrap.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Smoke boot Signal67 on Leaf
        shell: bash
        run: |
          set -euo pipefail

          JAR=source/Signal67/build/libs/Signal67-1.0-Leaf-1.21.11.jar
          mkdir -p .ci-leaf/plugins
          rm -rf .ci-leaf/plugins/Signal67
          cp "$JAR" .ci-leaf/plugins/

          cd .ci-leaf
          rm -f signal67-smoke.log logs/latest.log

          java -Xms512M -Xmx1G -jar leaf.jar nogui > signal67-smoke.log 2>&1 &
          pid=$!
          enabled=0

          for _ in $(seq 1 90); do
            if grep -q 'Signal67 enabled. Active rewards:' signal67-smoke.log logs/latest.log 2>/dev/null; then
              enabled=1
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              cat signal67-smoke.log
              exit 1
            fi

            sleep 1
          done

          if [ "$enabled" -ne 1 ]; then
            echo 'Signal67 did not report a successful enable.'
            cat signal67-smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          if grep -E -q 'Could not load.*Signal67|Error occurred while enabling Signal67|Exception.*Signal67|NoSuchMethodError|NoClassDefFoundError' \
              signal67-smoke.log logs/latest.log 2>/dev/null; then
            echo 'Signal67 emitted a load/enable-time error.'
            cat signal67-smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          test -f plugins/Signal67/config.yml
          grep -q '^trigger: "67"$' plugins/Signal67/config.yml
          grep -q '^cooldown-seconds: 3600$' plugins/Signal67/config.yml

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Signal67-Leaf-1.21.11
          path: source/Signal67/build/libs/Signal67-1.0-Leaf-1.21.11.jar
          if-no-files-found: error
