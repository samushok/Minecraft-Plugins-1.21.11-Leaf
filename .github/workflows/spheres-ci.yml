name: Spheres CI

on:
  push:
    branches:
      - merge/unified-spheres
      - feature/storm-sphere
    paths:
      - 'source/Spheres/**'
      - '.github/workflows/spheres-ci.yml'
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Leaf 1.21.11 build 179
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-leaf
          cd .ci-leaf
          curl -fL --retry 3 -o leaf.jar             https://api.leafmc.one/v2/projects/leaf/versions/1.21.11/builds/179/downloads/leaf-1.21.11-179.jar
          echo 'eula=true' > eula.txt
          java -Xms512M -Xmx1G -jar leaf.jar nogui > bootstrap.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' bootstrap.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat bootstrap.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat bootstrap.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test -d libraries
          test -d versions
          SERVER_JAR="$(find versions/1.21.11 -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          if [ -z "$SERVER_JAR" ]; then
            echo 'Patched Leaf server JAR was not created.'
            cat bootstrap.log
            exit 1
          fi
          echo "SERVER_JAR=$PWD/$SERVER_JAR" >> "$GITHUB_ENV"
          echo "LIBRARIES_DIR=$PWD/libraries" >> "$GITHUB_ENV"

      - name: Compile Spheres
        shell: bash
        run: |
          set -euo pipefail
          python3 source/Spheres/build.py             --server "$SERVER_JAR"             --libraries "$LIBRARIES_DIR"
          test -f source/Spheres/build/Spheres-1.3.1-Leaf-1.21.11.jar

      - name: Validate JAR structure and commands
        shell: bash
        run: |
          set -euo pipefail
          JAR=source/Spheres/build/Spheres-1.3.1-Leaf-1.21.11.jar
          jar tf "$JAR" > /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/SpheresPlugin.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/SummerShullerModule.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/SantaSphere.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/StormSphere.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/StormBlackHoleSession.class' /tmp/spheres-jar.txt
          grep -q 'plugin.yml' /tmp/spheres-jar.txt
          grep -q 'config.yml' /tmp/spheres-jar.txt
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'paperweight-mappings-namespace: mojang'

          unzip -p "$JAR" plugin.yml > /tmp/spheres-plugin.yml
          unzip -p "$JAR" config.yml > /tmp/spheres-config.yml

          grep -q "version: '1.3.1-1.21.11'" /tmp/spheres-plugin.yml
          grep -q 'stormball:' /tmp/spheres-plugin.yml
          grep -q 'stormconfig:' /tmp/spheres-plugin.yml
          grep -q 'stormconfig.use:' /tmp/spheres-plugin.yml
          grep -q 'stormstop:' /tmp/spheres-plugin.yml
          grep -q 'stormstop.use:' /tmp/spheres-plugin.yml

          grep -q '^storm:' /tmp/spheres-config.yml
          grep -q '^  black-hole:' /tmp/spheres-config.yml
          grep -q 'duration-seconds: 30' /tmp/spheres-config.yml
          grep -q 'radius: 14.0' /tmp/spheres-config.yml
          grep -q 'pull-strength: 0.20' /tmp/spheres-config.yml
          grep -q 'particle-density: 2.6' /tmp/spheres-config.yml
          grep -q 'one-active-per-owner: true' /tmp/spheres-config.yml
          grep -q 'admin-stop-collapse: false' /tmp/spheres-config.yml
          grep -q 'refresh-duration-ticks: 12' /tmp/spheres-config.yml
          grep -q 'countdown-title-enabled: true' /tmp/spheres-config.yml
          grep -q 'interval-seconds: 2.5' /tmp/spheres-config.yml
          grep -q 'BLOCK_PORTAL_AMBIENT' /tmp/spheres-config.yml
          grep -q 'BLOCK_RESPAWN_ANCHOR_DEPLETE' /tmp/spheres-config.yml
          grep -q 'max-upward-velocity: 0.22' /tmp/spheres-config.yml
          grep -q 'max-horizontal-velocity: 1.45' /tmp/spheres-config.yml
          grep -q 'capture-radius: 2.1' /tmp/spheres-config.yml
          grep -q 'capture-damping: 0.30' /tmp/spheres-config.yml
          grep -q 'event-horizon-blocks:' /tmp/spheres-config.yml
          grep -q 'rings: 5' /tmp/spheres-config.yml
          grep -q 'infall-streams:' /tmp/spheres-config.yml
          grep -q 'count: 52' /tmp/spheres-config.yml
          grep -q 'trail-points: 5' /tmp/spheres-config.yml
          grep -q 'duration-ticks: 28' /tmp/spheres-config.yml
          grep -q 'block-start-radius-multiplier: 2.8' /tmp/spheres-config.yml
          grep -q 'lensing-halo:' /tmp/spheres-config.yml
          grep -q 'points-per-layer: 180' /tmp/spheres-config.yml
          grep -q 'halo-inner: "#f1ecff"' /tmp/spheres-config.yml
          grep -q 'halo-outer: "#7e5cff"' /tmp/spheres-config.yml
          grep -q 'infall-outer: "#47d9ff"' /tmp/spheres-config.yml
          grep -q 'infall-inner: "#aa55ff"' /tmp/spheres-config.yml
          grep -q 'sonic-boom-effect: true' /tmp/spheres-config.yml
          grep -q '^    time-fracture:' /tmp/spheres-config.yml
          grep -q '^    temporal-echo:' /tmp/spheres-config.yml
          grep -q '^    reality-fractures:' /tmp/spheres-config.yml
          grep -q '^    collapse:' /tmp/spheres-config.yml
          grep -q '%ability_details%' /tmp/spheres-config.yml
          grep -q '^    texture: ""' /tmp/spheres-config.yml

          grep -q 'new StormBlackHoleSession' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          grep -q 'tryLockTarget' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          grep -q 'onBlackHoleFinished' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          grep -q 'hasActiveBlackHole' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          grep -q 'maxConcurrent > 0' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          grep -q 'stopAllBlackHoles' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          grep -q 'name.equals("stormstop")' source/Spheres/src/main/java/me/saminasian/spheres/SpheresPlugin.java
          grep -q 'Time Fracture' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          ! grep -q 'storm.ability.launch-power' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          ! grep -q 'slamTargets' source/Spheres/src/main/java/me/saminasian/spheres/StormSphere.java
          ! grep -q 'storm.ability.launch-power' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          ! grep -q 'orbit-strength' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          ! grep -q 'outward-kick' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          ! grep -q 'ejectTargets' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          ! grep -q 'applyRealityFractureGravity' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'Pure implosion pulse' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'captured players are only sucked' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java

          grep -q 'class StormBlackHoleSession' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderCore' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderAccretionDisk' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderInfallStreams' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderLensingHalo' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'formationVisualScale' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'formationProgress' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'easeOutCubic' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'Particle.SONIC_BOOM' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'event-horizon-blocks' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'spawnShards' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'updateTimeFracture' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderTemporalEcho' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderRealityFractures' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'updatePulse' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'renderCollapse' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'updateAmbientSound' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java
          grep -q 'updateCollapseCountdown' source/Spheres/src/main/java/me/saminasian/spheres/StormBlackHoleSession.java

          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/spheres-plugin.yml').read_text(encoding='utf-8')
          commands = text.split('commands:',1)[1].split('permissions:',1)[0]
          names = []
          for line in commands.splitlines():
              if line.startswith('  ') and not line.startswith('    ') and line.strip().endswith(':'):
                  names.append(line.strip()[:-1])
          assert names == ['summerball','shullerball','santaball','stormball','stormconfig','stormstop'], names
          PY

      - name: Smoke boot and Santa cooldown migration
        shell: bash
        run: |
          set -euo pipefail
          cp source/Spheres/build/Spheres-1.3.1-Leaf-1.21.11.jar .ci-leaf/plugins/
          cd .ci-leaf
          rm -rf plugins/Spheres
          mkdir -p plugins/Santaball
          legacy_uuid='11111111-2222-3333-4444-555555555555'
          now_ms="$(($(date +%s) * 1000))"
          printf '%s=%s\n' "$legacy_uuid" "$now_ms" > plugins/Santaball/cooldowns.properties
          rm -f logs/latest.log spheres-smoke.log

          java -Xms512M -Xmx1G -jar leaf.jar nogui > spheres-smoke.log 2>&1 &
          pid=$!
          enabled=0
          for _ in $(seq 1 90); do
            if grep -q 'Spheres enabled: SUMMER, SHULLER, SANTA, STORM' spheres-smoke.log logs/latest.log 2>/dev/null; then
              enabled=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat spheres-smoke.log
              exit 1
            fi
            sleep 1
          done

          if [ "$enabled" -ne 1 ]; then
            echo 'Spheres did not report a successful enable.'
            cat spheres-smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          if grep -E -q 'Could not load.*Spheres|Error occurred while enabling Spheres|Exception.*Spheres' spheres-smoke.log logs/latest.log 2>/dev/null; then
            echo 'Spheres emitted an enable-time error.'
            cat spheres-smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          test -f plugins/Spheres/cooldowns.properties
          grep -q "$legacy_uuid" plugins/Spheres/cooldowns.properties
          grep -q "$legacy_uuid" plugins/Santaball/cooldowns.properties

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: Spheres-1.3.1-Leaf-1.21.11
          path: source/Spheres/build/Spheres-1.3.1-Leaf-1.21.11.jar
          if-no-files-found: error
