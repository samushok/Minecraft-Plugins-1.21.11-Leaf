name: Spheres CI

on:
  push:
    branches:
      - merge/unified-spheres
    paths:
      - 'source/Spheres/**'
      - '.github/workflows/spheres-ci.yml'
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Leaf 1.21.11 build 179
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-leaf
          cd .ci-leaf
          curl -fL --retry 3 -o leaf.jar             https://api.leafmc.one/v2/projects/leaf/versions/1.21.11/builds/179/downloads/leaf-1.21.11-179.jar
          echo 'eula=true' > eula.txt
          set +e
          timeout 120s java -Xms512M -Xmx1G -jar leaf.jar nogui > bootstrap.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat bootstrap.log
            exit "$code"
          fi
          test -d libraries
          test -d versions
          SERVER_JAR="$(find versions/1.21.11 -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          if [ -z "$SERVER_JAR" ]; then
            echo 'Patched Leaf server JAR was not created.'
            cat bootstrap.log
            exit 1
          fi
          echo "SERVER_JAR=$PWD/$SERVER_JAR" >> "$GITHUB_ENV"
          echo "LIBRARIES_DIR=$PWD/libraries" >> "$GITHUB_ENV"

      - name: Compile Spheres
        shell: bash
        run: |
          set -euo pipefail
          python3 source/Spheres/build.py             --server "$SERVER_JAR"             --libraries "$LIBRARIES_DIR"
          test -f source/Spheres/build/Spheres-1.0-Leaf-1.21.11.jar

      - name: Validate JAR structure
        shell: bash
        run: |
          set -euo pipefail
          JAR=source/Spheres/build/Spheres-1.0-Leaf-1.21.11.jar
          jar tf "$JAR" | grep -q 'me/saminasian/spheres/SpheresPlugin.class'
          jar tf "$JAR" | grep -q 'me/saminasian/spheres/SummerShullerModule.class'
          jar tf "$JAR" | grep -q 'me/saminasian/spheres/SantaSphere.class'
          jar tf "$JAR" | grep -q 'me/saminasian/spheres/SantaNpcOverlay.class'
          jar tf "$JAR" | grep -q 'plugin.yml'
          jar tf "$JAR" | grep -q 'config.yml'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'paperweight-mappings-namespace: mojang'

      - name: Smoke boot Spheres on Leaf
        shell: bash
        run: |
          set -euo pipefail
          cp source/Spheres/build/Spheres-1.0-Leaf-1.21.11.jar .ci-leaf/plugins/
          cd .ci-leaf
          rm -f logs/latest.log
          set +e
          timeout 120s java -Xms512M -Xmx1G -jar leaf.jar nogui > spheres-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat spheres-smoke.log
            exit "$code"
          fi
          if ! grep -q 'Spheres enabled: SUMMER, SHULLER, SANTA' spheres-smoke.log logs/latest.log 2>/dev/null; then
            echo 'Spheres did not report a successful enable.'
            cat spheres-smoke.log
            exit 1
          fi
          if grep -E -q 'Could not load.*Spheres|Error occurred while enabling Spheres|Exception.*Spheres' spheres-smoke.log logs/latest.log 2>/dev/null; then
            echo 'Spheres emitted an enable-time error.'
            cat spheres-smoke.log
            exit 1
          fi

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: Spheres-1.0-Leaf-1.21.11
          path: source/Spheres/build/Spheres-1.0-Leaf-1.21.11.jar
          if-no-files-found: error
