name: Spheres CI

on:
  push:
    branches:
      - merge/unified-spheres
      - feature/storm-sphere
    paths:
      - 'source/Spheres/**'
      - '.github/workflows/spheres-ci.yml'
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Leaf 1.21.11 build 179
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-leaf
          cd .ci-leaf
          curl -fL --retry 3 -o leaf.jar             https://api.leafmc.one/v2/projects/leaf/versions/1.21.11/builds/179/downloads/leaf-1.21.11-179.jar
          echo 'eula=true' > eula.txt
          java -Xms512M -Xmx1G -jar leaf.jar nogui > bootstrap.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' bootstrap.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat bootstrap.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat bootstrap.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test -d libraries
          test -d versions
          SERVER_JAR="$(find versions/1.21.11 -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          if [ -z "$SERVER_JAR" ]; then
            echo 'Patched Leaf server JAR was not created.'
            cat bootstrap.log
            exit 1
          fi
          echo "SERVER_JAR=$PWD/$SERVER_JAR" >> "$GITHUB_ENV"
          echo "LIBRARIES_DIR=$PWD/libraries" >> "$GITHUB_ENV"

      - name: Compile Spheres
        shell: bash
        run: |
          set -euo pipefail
          python3 source/Spheres/build.py             --server "$SERVER_JAR"             --libraries "$LIBRARIES_DIR"
          test -f source/Spheres/build/Spheres-1.3.2-Leaf-1.21.11.jar

      - name: Validate JAR structure and commands
        shell: bash
        run: |
          set -euo pipefail
          JAR=source/Spheres/build/Spheres-1.3.2-Leaf-1.21.11.jar
          jar tf "$JAR" > /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/SpheresPlugin.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/SummerShullerModule.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/SantaSphere.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/StormSphere.class' /tmp/spheres-jar.txt
          grep -q 'me/saminasian/spheres/StormBlackHoleSession.class' /tmp/spheres-jar.txt
          grep -q 'plugin.yml' /tmp/spheres-jar.txt
          grep -q 'config.yml' /tmp/spheres-jar.txt
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'paperweight-mappings-namespace: mojang'

          unzip -p "$JAR" plugin.yml > /tmp/spheres-plugin.yml
          unzip -p "$JAR" config.yml > /tmp/spheres-config.yml

          grep -q "version: '1.3.2-1.21.11'" /tmp/spheres-plugin.yml
          grep -q 'stormball:' /tmp/spheres-plugin.yml
          grep -q 'stormconfig:' /tmp/spheres-plugin.yml
          grep -q 'stormconfig.use:' /tmp/spheres-plugin.yml
          grep -q 'stormstop:' /tmp/spheres-plugin.yml
          grep -q 'stormstop.use:' /tmp/spheres-plugin.yml

          grep -q '^storm:' /tmp/spheres-config.yml
          grep -q '^  black-hole:' /tmp/spheres-config.yml
          grep -q 'duration-seconds: 30' /tmp/spheres-config.yml
          grep -q 'radius: 14.0' /tmp/spheres-config.yml
          grep -q 'pull-strength: 0.20' /tmp/spheres-config.yml
          grep -q 'particle-density: 2.6' /tmp/spheres-config.yml
          grep -q 'refresh-ticks: 2' /tmp/spheres-config.yml
