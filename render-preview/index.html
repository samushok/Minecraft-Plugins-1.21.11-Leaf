<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Nexora — Roblox Marketplace Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="shell header-inner">
        <button class="brand-button" id="brandButton" type="button" aria-label="Go to marketplace home">
          <span class="brand-mark">N</span>
          <span class="brand-name">NEXORA</span>
        </button>

        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-button active" id="navMarketplace" type="button">Marketplace</button>
          <button class="nav-button" id="navChats" type="button">
            Chats <span class="nav-badge" id="chatBadge">0</span>
          </button>
          <button class="nav-button" id="navSettings" type="button">Settings</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="view active" id="marketplaceView"></section>
      <section class="view" id="gameView"></section>
      <section class="view" id="chatsView"></section>
      <section class="view" id="settingsView"></section>
    </main>

    <footer class="shell footer">
      Nexora Roblox marketplace prototype · Demo transactions only · No real money is charged.
    </footer>
  </div>

  <div class="overlay" id="offerModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="offerModalTitle">
      <div class="modal-header">
        <strong>Offer details</strong>
        <button class="icon-button" data-close-modal="offerModal" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="offerModalBody"></div>
    </div>
  </div>

  <div class="overlay" id="checkoutModal" aria-hidden="true">
    <div class="modal modal-compact" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
      <div class="modal-header">
        <strong id="checkoutTitle">Demo checkout</strong>
        <button class="icon-button" data-close-modal="checkoutModal" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="checkoutModalBody"></div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
