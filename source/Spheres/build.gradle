plugins { id 'java' }
group = 'me.saminasian'
version = '1.1'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
// Use the existing audited local server toolchain; no runtime downloader or shaded server classes.
def serverJar = providers.gradleProperty('serverJar').getOrElse('missing-server.jar')
def librariesDir = providers.gradleProperty('librariesDir').getOrElse('missing-libraries')
dependencies {
    compileOnly files(serverJar)
    compileOnly fileTree(dir: librariesDir, include: '**/*.jar')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-proc:none']
}
tasks.named('compileJava') {
    doFirst {
        if (!file(serverJar).isFile() || !file(librariesDir).isDirectory()) {
            throw new GradleException('Pass -PserverJar=/path/to/versions/1.21.11/leaf-1.21.11.jar -PlibrariesDir=/path/to/libraries (Java 21)')
        }
    }
}
jar {
    archiveFileName = 'Spheres-1.1-Leaf-1.21.11.jar'
    manifest { attributes('paperweight-mappings-namespace': 'mojang') }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
