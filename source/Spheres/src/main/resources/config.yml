# Spheres — Leaf/Paper 1.21.11, Java 21
# ==========================================================
#             SUMMER + SHULLER BALLS
# ==========================================================
# После изменения item.name / item.lore / texture-value / item.attributes
# просто снова используйте /summerball или /shullerball.
# Перед выдачей нового шара Spheres сам перечитает config.yml.
# ==========================================================

summer:
  # ========================================================
  # SUMMER — ГЛАВНАЯ КАСТОМИЗАЦИЯ ПРЕДМЕТА
  # name        = название шара
  # description = ГЛАВНОЕ описание/Lore предмета
  # texture     = внешний вид головы
  # attributes  = характеристики во второй руке
  # ========================================================
  item:
    name: "&a&lШАР &f &aSUMMER"

    # Главное описание шара. Можно добавлять/удалять сколько угодно строк.
    # Доступно: %damage% %armor% %ability% %cooldown%
    #           %melon_damage% %melon_radius%
    description:
      - "&a&lШАР &f &aШар &f - артефакт, который прячется"
      - "&fВ &n&6теплых &fлесах забытых тропических &aджунглей"
      - ""
      - "&7Когда во второй руке:"
      - "&c+%damage% Урон"
      - "&b+%armor% Броня"
      - ""
      - "&7При нажатии SHIFT: активирует &6%ability%"
      - "&7Задержка на способность: &c%cooldown% сек."
    texture-value: ""
    attributes:
      damage: 4.0
      armor: 7.35
    hide-vanilla-attributes: true

  ability:
    name: "Солнечный Солнцеворот"
    cooldown-seconds: 300
    cooldown-message: "&6Задержка: &fВы сможете использовать &6%ability% &fчерез &c%time% секунд."

    heat:
      radius: 7.0
      damage-hearts: 2.5
      fire-seconds: 6

    sounds:
      firecharge:
        sound: "ITEM_FIRECHARGE_USE"
        volume: 1.0
        pitch: 1.0
      blast:
        sound: "ENTITY_FIREWORK_ROCKET_BLAST"
        volume: 1.0
        pitch: 1.0

    fire-ring:
      enabled: true
      steps: 5
      points: 30
      start-radius: 0.8
      radius-step: 0.65

    portal:
      enabled: true
      duration-ticks: 20
      height: 12.0
      radius: 2.5
      points: 24

    melon-rain:
      enabled: true
      total-melons: 50
      melons-per-wave: 7
      interval-ticks: 8
      radius: 10.0
      damage-hearts: 1.5
      hitbox-expansion: 0.18
      spawn-height-min: 12.0
      spawn-height-max: 16.0
      slices-per-melon: 3
      slice-lifetime-ticks: 14
      red-ring:
        enabled: true
        height: 12.0
        points: 72
        refresh-ticks: 4
        particle-size: 1.25

# ==========================================================
#                       SHULLER
# ==========================================================
shuller:
  # ========================================================
  # SHULLER — ГЛАВНАЯ КАСТОМИЗАЦИЯ ПРЕДМЕТА
  # name        = название шара
  # description = ГЛАВНОЕ описание/Lore предмета
  # texture     = внешний вид головы
  # attributes  = характеристики во второй руке
  # ========================================================
  item:
    name: "&4&lШар &f &4Проклятье Утраты"

    # Главное описание шара. Можно добавлять/удалять сколько угодно строк.
    # Доступно: %damage% %speed% %ability% %cooldown%
    #           %radius% %invisibility% %debuff_duration%
    #           %strength_level% %cloud_radius%
    description:
      - "&7Шар &f &7создан из древнего &cзла &6Хэллоуинского проклятия,&7 никто не знает его мощь."
      - ""
      - "&7Когда во второй руке:"
      - "&4+%damage% Урон"
      - "&4+%speed%% Скорость"
      - ""
      - "&7При нажатии SHIFT: активирует &c%ability%"
      - "&7Задержка на способность: &c%cooldown% сек."
    texture-value: ""
    attributes:
      damage: 5.5
      # 30.0 = +30% скорости, пока шар во второй руке
      speed-percent: 30.0
    hide-vanilla-attributes: true

  ability:
    name: "Финальный Трюк"
    cooldown-seconds: 300
    cooldown-message: "&6Задержка: &fВы сможете использовать &6%ability% &fчерез &c%time% секунд."

    # Одно нажатие SHIFT активирует способность полностью.
    invisibility-seconds: 3.5

    # 3 = Speed III
    speed-level: 3

    # true = игрок полностью скрывается от других игроков,
    # включая броню и предметы в руках.
    full-hide: true

    # ----------------------------------------------------------
    # STRENGTH НА ОДИН УДАР
    # ----------------------------------------------------------
    strength-on-hit:
      enabled: true

      # 5 = Strength V
      level: 5

      # Заряд пропадёт после первого успешного ближнего удара.
      # Если игрок никого не ударил, это safety-время уберёт эффект.
      timeout-seconds: 30.0

    # ----------------------------------------------------------
    # БОЛЬШОЕ ТЁМНОЕ ОБЛАКО ВОКРУГ ИГРОКА
    # ----------------------------------------------------------
    cloud:
      enabled: true

      # 70 ticks = 3.5 секунды
      duration-ticks: 70

      # Чем меньше число, тем плотнее обновляется облако.
      # 2 ticks = 0.1 секунды.
      refresh-ticks: 2

      horizontal-radius: 4.5
      vertical-radius: 2.8

      particles:
        large-smoke: 34
        normal-smoke: 30
        squid-ink: 24
        white-ash: 24
        soul-fire: 12

    # ----------------------------------------------------------
    # ТЕЛЕПОРТ ЗА ПРОТИВНИКА
    #
    # ФУНКЦИЯ УЖЕ ЕСТЬ В КОДЕ, НО СЕЙЧАС ВЫКЛЮЧЕНА.
    # Чтобы включить позже:
    # enabled: true
    # ----------------------------------------------------------
    teleport-behind:
      enabled: false

      # Ищет игрока, на которого смотрит владелец SHULLER.
      range: 12.0

      # Насколько близко нужно смотреть в сторону цели.
      # Меньше = строже.
      max-angle-degrees: 70.0

      require-line-of-sight: true

      # На сколько блоков за спину противника телепортировать.
      behind-distance: 1.5

    sounds:
      witch:
        # В Bukkit 1.16.5 именно CELEBRATE используется как нужный звук ведьмы.
        sound: "ENTITY_WITCH_CELEBRATE"
        volume: 1.0
        pitch: 1.0
      cave:
        sound: "AMBIENT_CAVE"
        volume: 1.0
        pitch: 1.0

    debuff:
      radius: 8.0
      blindness-seconds: 3.0
      blindness-level: 1
      nausea-seconds: 3.0
      nausea-level: 1
      affect-players: true
      affect-mobs: true

    illusion:
      enabled: true

      # 70 ticks = 3.5 секунды
      duration-ticks: 70

      armor-stand:
        enabled: true
        helmet: "CARVED_PUMPKIN"

      bats:
        count: 6
        spawn-radius: 2.0

      particles:
        refresh-ticks: 2
        soul-count: 8
        ink-count: 5
        smoke-count: 8
        spread: 0.65
        ring-points: 20
        ring-radius: 1.8

santa:
  # ==========================================================
  #                         SANTABALL
  #                 Leaf / Paper 1.21.11 / Java 21
  # ==========================================================
  # Активация: одно нажатие SHIFT, пока шар во второй руке.
  # Санты появляются вокруг ВЛАДЕЛЬЦА шара.
  # Лавина выбирает ближайшего ДРУГОГО игрока только в радиусе.
  # Владелец полностью защищён от урона/отбрасывания/замедления
  # своей способности.
  # После изменения item/skin/reward настроек просто снова используйте /santaball.
  # Spheres перечитывает config.yml перед каждой командой выдачи.
  # ==========================================================
  
  # ========================================================
  # SANTA — ГЛАВНАЯ КАСТОМИЗАЦИЯ ПРЕДМЕТА
  # name        = название шара
  # description = ГЛАВНОЕ описание/Lore предмета
  # ball-texture-url = внешний вид самого шара
  # ========================================================
  item:
    name: "&c&lШАР &f❄ &cSANTA"

    # Главное описание шара. Можно добавлять/удалять сколько угодно строк.
    # Доступно: %range% %cooldown%
    description:
      - "&7Новогодний артефакт, наполненный магией Санты."
      - ""
      - "&7Во второй руке нажмите &fSHIFT&7:"
      - "&cСанта-парад &7+ &fСнежная лавина"
      - ""
      - "&7Радиус цели: &f%range% блоков"
      - "&7Кулдаун: &c%cooldown% сек."
  
    # Отдельная текстура САМОГО шара: красная новогодняя ёлочная игрушка.
    ball-texture-url: "http://textures.minecraft.net/texture/884e92487c6749995b79737b8a9eb4c43954797a6dd6cd9b4efce17cf475846"
    # Голова для ArmorStand fallback, если fake-player NPC не отобразится.
    santa-head-texture-url: "http://textures.minecraft.net/texture/8a159236d7512bdb4326a24e14502167b76bcd85c041931c2194201b17f5e7"
  
  ability:
    name: "Рождественская Лавина"
  
    # 5 минут по умолчанию. Сохраняется после рестарта сервера.
    cooldown-seconds: 300
  
    # Реальный жёсткий максимум в коде — 32 блока, даже если здесь поставить 1000.
    target-range: 18.0
    # Creative/Spectator и скрытые (vanish через Bukkit hidePlayer) игроки не выбираются целью.
    no-target-message: "&cРядом нет игрока для способности."
    cooldown-message: "&6Задержка: &f%ability% будет доступна через &c%time% сек."
  
    santas:
      enabled: true
      # По умолчанию 10 Santa NPC в РАНДОМНЫХ безопасных точках.
      count: 10
      random-min-radius: 2.0
      random-max-radius: 7.0
      lifetime-ticks: 180
      face-target: true
  
      # Fake-player визуал: NPC только для клиента, без AI/pathfinding.
      # ArmorStand внутри используется только как невидимый лёгкий якорь.
      player-npcs:
        enabled: true
        # Жёсткий максимум в коде: 48 блоков.
        view-distance: 32.0
        # Как часто проверять, кто вошёл/вышел из зоны видимости fake-NPC.
        # 10 тиков = 2 проверки/сек вместо 4.
        viewer-refresh-ticks: 10
        profile-cache-ticks: 10
        # Полный 64x64 Santa skin для fake-player NPC, а НЕ текстура головы/шара.
        skin-texture-url: "https://www.minecraftskins.com/uploads/skins/2022/04/22/santa-claus-20226303.png?v971"
        # Если у вас есть готовое Mojang/MineSkin texture value (+ signature),
        # вставьте их сюда: они имеют приоритет над URL и обычно надёжнее.
        skin-texture-value: ""
        skin-texture-signature: ""
  
      particles:
        enabled: true
        # Реже обновляем частицы, но сохраняем плотный визуальный эффект.
        refresh-ticks: 5
        red-count-per-santa: 4
        green-count-per-santa: 3
        snow-count-per-santa: 3
        spark-count-per-santa: 1
        spread: 0.45
        size: 1.30
  
      gifts:
        enabled: true
        # Всё ещё 60 подарков за способность, но они распределены по времени,
        # чтобы одновременно на земле было примерно 20–25, а не около 50.
        total: 60
        interval-ticks: 3
        lifetime-ticks: 70
        launch-horizontal: 0.38
        launch-up: 0.48
        reward:
          # По умолчанию каждый подобранный подарок = 100 монет.
          # amount можно менять без пересборки.
          amount: 100
          command: "eco give %player% %amount%"
          message: "&a+%amount% монет за подарок!"
        textures:
          red: "http://textures.minecraft.net/texture/b73a2114136b8ee4926caa51785414036a2b76e4f1668cb89d99716c421"
          green: "http://textures.minecraft.net/texture/884b8a32bc6de2884ba31398d5b028d1a4fa77f59a415b7e6f62f2623f4f6"
  
    avalanche:
      enabled: true

      # ОБЛАСТЬ ЛАВИНЫ:
      # ближайший игрок запускает эффект, а затем выбираются до 5 игроков
      # вокруг него. Так лавина выглядит массовой, но имеет жёсткий лимит нагрузки.
      area-radius: 12.0
      max-targets: 5
      stagger-ticks-max: 6

      # Каждый выбранный игрок получает свой большой снежный ком.
      # Ком появляется примерно на 6 блоков выше головы и первые 10 тиков
      # немного следует за целью.
      spawn-height: 6.0
      fall-duration-ticks: 24
      update-interval-ticks: 2
      track-target-ticks: 10

      # Визуальный размер. Даже при значении 3 каждый ком использует всего
      # 7 BlockDisplay (центр + 6 сторон), а не старые 27.
      sphere-radius-blocks: 3

      # Белая снежная буря вокруг всех выбранных игроков:
      # SNOWFLAKE + WHITE_ASH + CLOUD создают эффект почти белого тумана.
      storm:
        enabled: true
        duration-ticks: 60
        refresh-ticks: 4
        snow-count-per-target: 14
        white-ash-count-per-target: 10
        cloud-count-per-target: 5
        horizontal-spread: 2.6
        vertical-spread: 1.8

      particles:
        falling-snow-count: 12
        falling-cloud-count: 3
        impact-snow-count: 60
        impact-cloud-count: 18
        impact-block-count: 24
  
      impact-radius: 3.5
      damage-hearts: 4.0
      knockback-horizontal: 0.75
      knockback-up: 0.45
  
      slowness:
        enabled: true
        seconds: 2.5
        level: 2
  
    sounds:
      start:
        sound: "ENTITY_PLAYER_LEVELUP"
        volume: 1.0
        pitch: 1.25
      gift:
        sound: "ENTITY_ITEM_PICKUP"
        volume: 0.30
        pitch: 1.45
      falling:
        sound: "ENTITY_SNOWBALL_THROW"
        volume: 1.0
        pitch: 0.70
      impact:
        sound: "ENTITY_GENERIC_EXPLODE"
        volume: 1.0
        pitch: 0.85
  
  performance:
    # Защита от ситуации, когда много игроков одновременно жмут шар.
    # После multi-target лавины разрешено максимум 2 Santa-способности
    # одновременно. Даже если здесь поставить больше, код ограничит значение до 2.
    max-concurrent-abilities: 2
  
    # Не даёт обходить 5-минутный кулдаун обычным рестартом сервера.
    persist-cooldowns: true
  
  messages:
    given: "&aSantaball выдан игроку &f%player%&a."
    reloaded: "&aSantaball config перезагружен."
    no-permission: "&cУ вас нет прав."
    busy: "&eСлишком много новогодних эффектов одновременно. Попробуйте через пару секунд."
    failed: "&cСпособность не смогла запуститься. Кулдаун не потрачен."


# ==========================================================
#                          STORM
# ==========================================================
# STORM — data-driven сфера.
#
# Главное отличие:
# storm.item.properties — это конструктор пассивных характеристик.
# Свойство можно удалить полностью, добавить обратно через /stormconfig,
# изменить значение, порядок и текст. %bonuses% в description автоматически
# превращается только в АКТИВНЫЕ свойства.
# ==========================================================
storm:
  item:
    name: "&5&lШАР &8⚫ &dSTORM"

    # %bonuses% = только активные пассивные свойства шара.
    # %ability_details% = актуальные параметры Чёрной Дыры.
    # Также доступны: %ability%, %duration%, %radius%, %cooldown%.
    description:
      - "&8Артефакт искривлённого пространства."
      - "&7Внутри заключена настоящая &5Сингулярность&7."
      - ""
      - "&7Когда во второй руке:"
      - "%bonuses%"
      - ""
      - "&dSHIFT &7— создать &5%ability%"
      - "%ability_details%"

    # Текстура шара. Можно вставить:
    # 1) готовый base64 texture value;
    # 2) полный https://textures.minecraft.net/texture/... URL;
    # 3) только hash после /texture/.
    # Пусто = обычная PLAYER_HEAD.
    texture: ""
    hide-vanilla-attributes: true
    no-bonuses-line: "&8Нет пассивных бонусов"

    # ======================================================
    # MODULAR PROPERTIES
    # ======================================================
    # Любое свойство можно выключить через /stormconfig.
    # Оно сохраняется как enabled: false, поэтому не вернётся
    # после рестарта. При повторном включении старое значение
    # и оформление сохраняются.
    #
    # GUI:
    # ЛКМ          + значение
    # ПКМ          - значение
    # Shift+ЛКМ    поднять выше в lore
    # Shift+ПКМ    опустить ниже
    # Q             выключить property
    # ======================================================
    properties:
      speed:
        enabled: true
        value: 15.0
        order: 10
        display: "&b⚡ Скорость: &f+%value%%"

      attack-speed:
        enabled: true
        value: 10.0
        order: 20
        display: "&e⚔ Скорость атаки: &f+%value%%"

      damage:
        enabled: true
        value: 4.0
        order: 30
        display: "&c🗡 Урон: &f+%value%"

  # ========================================================
  # BLACK HOLE / SINGULARITY
  # ========================================================
  black-hole:
    name: "Сингулярность"

    # Время жизни одной Чёрной Дыры.
    duration-seconds: 30

    # Общая перезарядка владельца.
    cooldown-seconds: 90

    # Сколько Чёрных Дыр может существовать одновременно.
    # 0 = без лимита.
    max-concurrent: 2

    # Основной радиус захвата и визуала.
    radius: 14.0
    core-radius: 2.2

    spawn:
      # Дыра создаётся немного впереди и выше владельца.
      forward-offset: 4.0
      height-offset: 1.6

    lifecycle:
      # Если владелец вышел / умер / сменил мир — убрать дыру.
      cancel-if-owner-unavailable: true

      # true = один владелец не может держать две свои дыры одновременно.
      one-active-per-owner: true

      # Что делать при /stormstop: false = тихая очистка без Collapse.
      admin-stop-collapse: false

    targeting:
      players: true
      mobs: false
      require-pvp: true
      exclude-owner: true

      # false = можно создать красивую Чёрную Дыру даже без целей.
      require-target: false

      # Цель освобождается, если смогла уйти дальше radius * multiplier.
      release-radius-multiplier: 1.35
      scan-interval-ticks: 4

    # ======================================================
    # PURE SUCTION ENGINE
    # ======================================================
    # Игроки НЕ вращаются вокруг ядра и НЕ подбрасываются.
    # Притяжение работает только по X/Z к event horizon.
    gravity:
      pull-strength: 0.20
      velocity-damping: 0.82
      core-multiplier: 1.8

      # Не даёт способности превращаться в вертикальный launcher.
      max-upward-velocity: 0.22

      # Максимальная горизонтальная скорость всасывания.
      max-horizontal-velocity: 1.45

      # Внутри этой зоны игрок уже считается у event horizon:
      # его горизонтальный импульс гасится, чтобы он не пролетал
      # сквозь центр туда-сюда.
      capture-radius: 2.1
      capture-damping: 0.30

    # ======================================================
    # BLINDNESS
    # ======================================================
    blindness:
      enabled: true

      # По умолчанию почти весь радиус Чёрной Дыры.
      radius: 14.0
      amplifier: 0

      # Эффект постоянно обновляется, пока игрок внутри.
      refresh-duration-ticks: 12

    # ======================================================
    # SUCTION PULSE
    # ======================================================
    # Никакого outward kick. Каждые несколько секунд
    # чёрная дыра просто резко усиливает ВСАСЫВАНИЕ.
    gravity-pulse:
      enabled: true
      interval-seconds: 4.0
      crush-multiplier: 2.25
      crush-ticks: 18

    # ======================================================
    # TIME FRACTURE
    # ======================================================
    # Плагин запоминает историю движения игрока.
    # Во время разрыва пространства игрок реально возвращается
    # в своё старое положение и снова продолжает втягиваться.
    time-fracture:
      enabled: true
      interval-seconds: 6.0
      rewind-seconds: 2.0

      # Как часто сохранять координаты.
      history-interval-ticks: 2

      # Сколько секунд истории держать.
      max-history-seconds: 4.0

      title-enabled: true
      title: "&5&lTIME FRACTURE"
      subtitle: "&7Тебя вернуло в прошлое"

    # ======================================================
    # TEMPORAL ECHO
    # ======================================================
    # Визуальные следы прошлых позиций игрока.
    temporal-echo:
      enabled: true
      interval-ticks: 3
      history-points: 6
      particles-per-point: 5

    # ======================================================
    # REALITY FRACTURES
    # ======================================================
    # Только визуальные разрывы пространства.
    # Они больше НЕ дёргают игроков в стороны.
    reality-fractures:
      enabled: false
      count: 4
      orbit-radius: 6.5
      rotation-speed: 0.035
      particles-per-rift: 22

    # ======================================================
    # COLLAPSE FINALE
    # ======================================================
    # Последние секунды дыра сжимается и сильнее всасывает.
    # В конце — визуальный implosion. Игроков НЕ подбрасывает
    # и НЕ выбрасывает из центра.
    collapse:
      enabled: true
      warning-seconds: 3.0
      final-pull-multiplier: 3.2

      countdown-title-enabled: true
      countdown-owner: true
      countdown-title: "&5&lСХЛОПЫВАНИЕ"
      countdown-subtitle: "&f%time%"
      countdown-sound-enabled: true

      damage-enabled: false
      damage-hearts: 0.0
      lightning-effect: true

      # Только визуальный финальный "snap", физику игрока не меняет.
      sonic-boom-effect: true

    # ======================================================
    # PRESENTATION
    # ======================================================
    presentation:
      owner-title-enabled: true
      title: "&5&lСИНГУЛЯРНОСТЬ"
      subtitle: "&7Пространство начинает разрушаться..."

      capture-title-enabled: true
      capture-title: "&0&lEVENT HORIZON"
      capture-subtitle: "&5Пространство и время искажаются"

    # ======================================================
    # VISUALS — PURE BLACK HOLE
    # ======================================================
    visuals:
      # Намеренно много частиц.
      particle-density: 2.6
      refresh-ticks: 1
      respect-serverguardian: false

      # Плотный чёрный центр.
      core-points: 220

      colors:
        core: "#010103"
        disk-inner: "#6333ff"
        disk-outer: "#43d9ff"
        infall: "#8c61ff"
        infall-outer: "#47d9ff"
        infall-inner: "#aa55ff"
        halo-inner: "#f1ecff"
        halo-outer: "#7e5cff"
        pulse: "#c95fff"
        fracture: "#df46ff"
        echo: "#7055ff"
        collapse: "#f4edff"

      # ------------------------------------------------------
      # FORMATION
      # ------------------------------------------------------
      # Первые ~1.4 секунды чёрная дыра собирается из пространства:
      # блоки прилетают снаружи, ядро и кольца плавно увеличиваются.
      formation:
        duration-ticks: 28
        start-scale: 0.16
        block-start-radius-multiplier: 2.8
        center-start-radius: 5.5
        depth: 2.4

      # ------------------------------------------------------
      # EVENT HORIZON: настоящий чёрный круг из BlockDisplay
      # ------------------------------------------------------
      event-horizon:
        radius: 3.0

      # Светящееся gravitational-lensing кольцо по краю чёрного диска.
      lensing-halo:
        enabled: true
        layers: 3
        points-per-layer: 180
        gap: 0.30
        wobble: 0.10

      event-horizon-blocks:
        enabled: true

        # Несколько концентрических колец заполняют круг,
        # поэтому это выглядит как чёрный диск, а не россыпь блоков.
        rings: 5
        base-points: 12
        center-blocks: 9
        center-spread: 0.65
        scale: 0.42

        # Очень медленное вращение только ВИЗУАЛА.
        # Игроков эта настройка не вращает.
        rotation-speed: 0.005

        materials:
          - BLACK_CONCRETE
          - COAL_BLOCK
          - OBSIDIAN
          - BLACKSTONE

      # ------------------------------------------------------
      # ACCRETION RINGS
      # ------------------------------------------------------
      accretion:
        rings: 6
        points-per-ring: 180
        inner-radius: 3.4
        outer-radius: 8.5

      # ------------------------------------------------------
      # INFALL STREAMS
      # ------------------------------------------------------
      # Главный эффект всасывания: десятки потоков идут
      # С НАРУЖИ -> В ЧЁРНЫЙ КРУГ.
      infall-streams:
        enabled: true
        count: 52
        trail-points: 5
        inner-radius: 3.2
        outer-radius: 13.0
        speed: 0.020

      fracture-burst-particles: 70
      gravity-pulse-ring: true
    # ======================================================
    # SOUNDS
    # ======================================================
    sounds:
      # Низкий постоянный фон, чтобы сингулярность ощущалась "живой".
      ambient:
        enabled: true
        interval-seconds: 2.5
        sound: "BLOCK_PORTAL_AMBIENT"
        volume: 0.55
        pitch: 0.50

      create:
        sound: "ENTITY_WITHER_SPAWN"
        volume: 1.25
        pitch: 0.55

      capture:
        sound: "ENTITY_ENDERMAN_TELEPORT"
        volume: 0.75
        pitch: 0.55

      gravity-pulse:
        sound: "BLOCK_SCULK_SHRIEKER_SHRIEK"
        volume: 0.75
        pitch: 0.55

      time-fracture:
        sound: "ENTITY_ENDERMAN_TELEPORT"
        volume: 1.0
        pitch: 1.65

      collapse-countdown:
        sound: "BLOCK_RESPAWN_ANCHOR_DEPLETE"
        volume: 0.9
        pitch: 0.65

      collapse:
        sound: "ENTITY_GENERIC_EXPLODE"
        volume: 1.6
        pitch: 0.45

  messages:
    cooldown: "&5STORM &7снова создаст сингулярность через &f%time% сек."
    no-target: "&7Рядом нет целей для &5Сингулярности&7."
    busy: "&5STORM &7не может создать ещё одну сингулярность прямо сейчас."
    created: "&5&lSTORM &8» &fСингулярность создана."
    owner-active: "&5STORM &7у тебя уже есть активная сингулярность."
    stopped: "&5STORM &8» &7Остановлено активных сингулярностей: &f%count%&7."
