# Spheres — Leaf/Paper 1.21.11, Java 21
# ==========================================================
#             SUMMER + SHULLER BALLS
# ==========================================================
# После изменения конфига:
# /summerball reload
#
# Если меняли item.name / item.lore / texture-value /
# item.attributes, нужно выдать НОВЫЙ шар.
# ==========================================================

summer:
  item:
    name: "&a&lШАР &f &aSUMMER"
    lore:
      - "&a&lШАР &f &aШар &f - артефакт, который прячется"
      - "&fВ &n&6теплых &fлесах забытых тропических &aджунглей"
      - ""
      - "&7Когда во второй руке:"
      - "&c+%damage% Урон"
      - "&b+%armor% Броня"
      - ""
      - "&7При нажатии SHIFT: активирует &6%ability%"
      - "&7Задержка на способность: &c%cooldown% сек."
    texture-value: ""
    attributes:
      damage: 4.0
      armor: 7.35
    hide-vanilla-attributes: true

  ability:
    name: "Солнечный Солнцеворот"
    cooldown-seconds: 300
    cooldown-message: "&6Задержка: &fВы сможете использовать &6%ability% &fчерез &c%time% секунд."

    heat:
      radius: 7.0
      damage-hearts: 2.5
      fire-seconds: 6

    sounds:
      firecharge:
        sound: "ITEM_FIRECHARGE_USE"
        volume: 1.0
        pitch: 1.0
      blast:
        sound: "ENTITY_FIREWORK_ROCKET_BLAST"
        volume: 1.0
        pitch: 1.0

    fire-ring:
      enabled: true
      steps: 5
      points: 30
      start-radius: 0.8
      radius-step: 0.65

    portal:
      enabled: true
      duration-ticks: 20
      height: 12.0
      radius: 2.5
      points: 24

    melon-rain:
      enabled: true
      total-melons: 50
      melons-per-wave: 7
      interval-ticks: 8
      radius: 10.0
      damage-hearts: 1.5
      hitbox-expansion: 0.18
      spawn-height-min: 12.0
      spawn-height-max: 16.0
      slices-per-melon: 3
      slice-lifetime-ticks: 14
      red-ring:
        enabled: true
        height: 12.0
        points: 72
        refresh-ticks: 4
        particle-size: 1.25

# ==========================================================
#                       SHULLER
# ==========================================================
shuller:
  item:
    name: "&4&lШар &f &4Проклятье Утраты"
    lore:
      - "&7Шар &f &7создан из древнего &cзла &6Хэллоуинского проклятия,&7 никто не знает его мощь."
      - ""
      - "&7Когда во второй руке:"
      - "&4+%damage% Урон"
      - "&4+%speed%% Скорость"
      - ""
      - "&7При нажатии SHIFT: активирует &c%ability%"
      - "&7Задержка на способность: &c%cooldown% сек."
    texture-value: ""
    attributes:
      damage: 5.5
      # 30.0 = +30% скорости, пока шар во второй руке
      speed-percent: 30.0
    hide-vanilla-attributes: true

  ability:
    name: "Финальный Трюк"
    cooldown-seconds: 300
    cooldown-message: "&6Задержка: &fВы сможете использовать &6%ability% &fчерез &c%time% секунд."

    # Одно нажатие SHIFT активирует способность полностью.
    invisibility-seconds: 3.5

    # 3 = Speed III
    speed-level: 3

    # true = игрок полностью скрывается от других игроков,
    # включая броню и предметы в руках.
    full-hide: true

    # ----------------------------------------------------------
    # STRENGTH НА ОДИН УДАР
    # ----------------------------------------------------------
    strength-on-hit:
      enabled: true

      # 5 = Strength V
      level: 5

      # Заряд пропадёт после первого успешного ближнего удара.
      # Если игрок никого не ударил, это safety-время уберёт эффект.
      timeout-seconds: 30.0

    # ----------------------------------------------------------
    # БОЛЬШОЕ ТЁМНОЕ ОБЛАКО ВОКРУГ ИГРОКА
    # ----------------------------------------------------------
    cloud:
      enabled: true

      # 70 ticks = 3.5 секунды
      duration-ticks: 70

      # Чем меньше число, тем плотнее обновляется облако.
      # 2 ticks = 0.1 секунды.
      refresh-ticks: 2

      horizontal-radius: 4.5
      vertical-radius: 2.8

      particles:
        large-smoke: 34
        normal-smoke: 30
        squid-ink: 24
        white-ash: 24
        soul-fire: 12

    # ----------------------------------------------------------
    # ТЕЛЕПОРТ ЗА ПРОТИВНИКА
    #
    # ФУНКЦИЯ УЖЕ ЕСТЬ В КОДЕ, НО СЕЙЧАС ВЫКЛЮЧЕНА.
    # Чтобы включить позже:
    # enabled: true
    # ----------------------------------------------------------
    teleport-behind:
      enabled: false

      # Ищет игрока, на которого смотрит владелец SHULLER.
      range: 12.0

      # Насколько близко нужно смотреть в сторону цели.
      # Меньше = строже.
      max-angle-degrees: 70.0

      require-line-of-sight: true

      # На сколько блоков за спину противника телепортировать.
      behind-distance: 1.5

    sounds:
      witch:
        # В Bukkit 1.16.5 именно CELEBRATE используется как нужный звук ведьмы.
        sound: "ENTITY_WITCH_CELEBRATE"
        volume: 1.0
        pitch: 1.0
      cave:
        sound: "AMBIENT_CAVE"
        volume: 1.0
        pitch: 1.0

    debuff:
      radius: 8.0
      blindness-seconds: 3.0
      blindness-level: 1
      nausea-seconds: 3.0
      nausea-level: 1
      affect-players: true
      affect-mobs: true

    illusion:
      enabled: true

      # 70 ticks = 3.5 секунды
      duration-ticks: 70

      armor-stand:
        enabled: true
        helmet: "CARVED_PUMPKIN"

      bats:
        count: 6
        spawn-radius: 2.0

      particles:
        refresh-ticks: 2
        soul-count: 8
        ink-count: 5
        smoke-count: 8
        spread: 0.65
        ring-points: 20
        ring-radius: 1.8

santa:
  # ==========================================================
  #                         SANTABALL
  #                 Leaf / Paper 1.21.11 / Java 21
  # ==========================================================
  # Активация: одно нажатие SHIFT, пока шар во второй руке.
  # Санты появляются вокруг ВЛАДЕЛЬЦА шара.
  # Лавина выбирает ближайшего ДРУГОГО игрока только в радиусе.
  # Владелец полностью защищён от урона/отбрасывания/замедления
  # своей способности.
  # После изменения: /santaball reload
  # ==========================================================
  
  item:
    name: "&c&lШАР &f❄ &cSANTA"
    lore:
      - "&7Новогодний артефакт, наполненный магией Санты."
      - ""
      - "&7Во второй руке нажмите &fSHIFT&7:"
      - "&cСанта-парад &7+ &fСнежная лавина"
      - ""
      - "&7Радиус цели: &f%range% блоков"
      - "&7Кулдаун: &c%cooldown% сек."
  
    # Текстура применяется через Paper profile API, без загрузок на сервере.
    santa-head-texture-url: "http://textures.minecraft.net/texture/8a159236d7512bdb4326a24e14502167b76bcd85c041931c2194201b17f5e7"
  
  ability:
    name: "Рождественская Лавина"
  
    # 5 минут по умолчанию. Сохраняется после рестарта сервера.
    cooldown-seconds: 300
  
    # Реальный жёсткий максимум в коде — 32 блока, даже если здесь поставить 1000.
    target-range: 18.0
    # Creative/Spectator и скрытые (vanish через Bukkit hidePlayer) игроки не выбираются целью.
    no-target-message: "&cРядом нет игрока для способности."
    cooldown-message: "&6Задержка: &f%ability% будет доступна через &c%time% сек."
  
    santas:
      enabled: true
      # Жёсткий максимум в коде: 8.
      count: 6
      ring-radius: 4.5
      lifetime-ticks: 90
      face-target: true
  
      # Fake-player визуал: NPC только для клиента, без AI/pathfinding.
      # ArmorStand внутри используется только как невидимый лёгкий якорь.
      player-npcs:
        enabled: true
        # Жёсткий максимум в коде: 48 блоков.
        view-distance: 32.0
        profile-cache-ticks: 10
        skin-texture-url: "http://textures.minecraft.net/texture/8a159236d7512bdb4326a24e14502167b76bcd85c041931c2194201b17f5e7"
  
      particles:
        enabled: true
        refresh-ticks: 5
        red-count-per-santa: 2
        green-count-per-santa: 1
        snow-count-per-santa: 1
        spread: 0.30
        size: 1.15
  
      gifts:
        enabled: true
        # Жёсткий максимум в коде: 32. По умолчанию 12 для меньшей нагрузки.
        total: 12
        interval-ticks: 5
        lifetime-ticks: 34
        launch-horizontal: 0.32
        launch-up: 0.42
        textures:
          red: "http://textures.minecraft.net/texture/b73a2114136b8ee4926caa51785414036a2b76e4f1668cb89d99716c421"
          green: "http://textures.minecraft.net/texture/884b8a32bc6de2884ba31398d5b028d1a4fa77f59a415b7e6f62f2623f4f6"
  
    avalanche:
      enabled: true
      spawn-height: 14.0
      fall-duration-ticks: 24
      # Обновляется раз в 2 тика вместо каждого тика — заметно легче для сервера.
      update-interval-ticks: 2
      track-target-ticks: 10
  
      # 1 = 7 BlockDisplay, 2 = 19 BlockDisplay. Больше 2 код не разрешит.
      sphere-radius-blocks: 2
  
      impact-radius: 3.5
      damage-hearts: 4.0
      knockback-horizontal: 0.75
      knockback-up: 0.45
  
      slowness:
        enabled: true
        seconds: 2.5
        level: 2
  
    sounds:
      start:
        sound: "ENTITY_PLAYER_LEVELUP"
        volume: 1.0
        pitch: 1.25
      gift:
        sound: "ENTITY_ITEM_PICKUP"
        volume: 0.30
        pitch: 1.45
      falling:
        sound: "ENTITY_SNOWBALL_THROW"
        volume: 1.0
        pitch: 0.70
      impact:
        sound: "ENTITY_GENERIC_EXPLODE"
        volume: 1.0
        pitch: 0.85
  
  performance:
    # Защита от ситуации, когда много игроков одновременно жмут шар.
    # По умолчанию 4; жёсткий максимум в коде остаётся 8.
    max-concurrent-abilities: 4
  
    # Не даёт обходить 5-минутный кулдаун обычным рестартом сервера.
    persist-cooldowns: true
  
  messages:
    given: "&aSantaball выдан игроку &f%player%&a."
    reloaded: "&aSantaball config перезагружен."
    no-permission: "&cУ вас нет прав."
    busy: "&eСлишком много новогодних эффектов одновременно. Попробуйте через пару секунд."
    failed: "&cСпособность не смогла запуститься. Кулдаун не потрачен."
