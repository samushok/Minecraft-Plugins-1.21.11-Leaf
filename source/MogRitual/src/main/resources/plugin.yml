name: MogRitual
version: '1.0-Leaf-1.21.11'
main: me.saminasian.mogritual.MogRitualPlugin
api-version: '1.21.11'
author: saminasian
description: Low-load 3-player chat ritual and roulette for Leaf/Paper 1.21.11

commands:
  mogritual:
    description: MogRitual admin/status command
    usage: /mogritual [status|reload]
  mogchance:
    description: Show configured MogRitual display chances
    usage: /mogchance

permissions:
  mogritual.admin:
    description: Reload MogRitual config
    default: op
