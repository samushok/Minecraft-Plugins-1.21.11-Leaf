# ==========================================================
#                    MOG RITUAL v1.4
#             Leaf / Paper 1.21.11 / Java 21
# ==========================================================
#
# ЛОГИКА ПО УМОЛЧАНИЮ:
# 1) 2 РАЗНЫХ игрока рядом пишут: "я тебя могну".
#    Регистр не важен: "Я Тебя Могну" и "Я ТЕБЯ МОГНУ" тоже сработают.
# 2) После первого игрока на экране показывается,
#    что нужен ещё 1 игрок и осталось 12 секунд.
# 3) Если второй успел — запускается лёгкая 4-секундная анимация.
# 4) Затем запускается короткая roulette-анимация.
# 5) Каждый из двух получает свою награду.
# 6) Только ПОСЛЕ успешного завершения ставится cooldown 6 часов.
#
# ПРОИЗВОДИТЕЛЬНОСТЬ:
# - НЕТ ArmorStand / ItemDisplay / TextDisplay / NPC.
# - Для танца максимум 3 BlockDisplay на игрока = 6 на весь ритуал.
# - Они существуют только несколько секунд и гарантированно удаляются.
# - Один task во время ritual и один task во время roulette.
#
# После изменения:
#   /mogritual reload
# Проверка конфига:
#   /mogritual validate
# ==========================================================

config-version: 6

general:
  # Быстро выключить весь trigger без удаления JAR.
  enabled: true

# ==========================================================
#                     RESOURCE PACK
# ==========================================================
resource-pack:
  # После того как pack будет загружен на HTTPS-хостинг, включи true.
  enabled: false

  # Прямая ссылка на .zip resource pack.
  url: ""

  # SHA-1 именно ZIP-файла: 40 hex-символов.
  sha1: ""

  # true = клиенту предлагается обязательный server resource pack.
  required: true

  # true = ритуал вообще не стартует, пока наш pack не SUCCESSFULLY_LOADED.
  # Включай вместе с enabled=true после заполнения URL + SHA-1.
  require-for-ritual: false

  # Автоматически отправлять pack после входа игрока.
  send-on-join: true
  join-delay-ticks: 40

  prompt: "&dМузыкальный pack нужен для cinematic-ритуала «Я тебя могну»."

# ==========================================================
#                        TRIGGER
# ==========================================================
trigger:
  # Основная фраза.
  phrase: "я тебя могну"

  # Сколько РАЗНЫХ игроков нужно.
  required-players: 2

  # Сколько секунд второй игрок может присоединиться после первого.
  window-seconds: 12

  # TITLE после первого участника.
  # %missing% = сколько игроков ещё нужно.
  waiting-title: "&d&lВам нужен ещё %missing% игрок для ритуала"
  waiting-subtitle: "&fУ вас %seconds% секунд"

  # TITLE если второй игрок не успел.
  expired-title: "&c&lВремя ритуала истекло"
  expired-subtitle: "&7Нужен ещё один игрок"

  # Игроки должны собраться рядом с первым участником.
  gather-radius: 12.0

  # Во время самого ритуала можно отходить от центра не дальше этого радиуса.
  # Если кто-то выйдет за пределы / сменит мир / умрёт / выйдет с сервера,
  # ритуал отменится.
  max-distance-during-ritual: 24.0

  # false = фраза остаётся видна в обычном чате.
  # true  = trigger-сообщение скрывается.
  hide-trigger-message: false

  # Совместимость с отдельными chat-controller плагинами.
  # На вашем сервере включено по умолчанию: даже если chat-controller
  # отменяет стандартный Paper chat event, фраза всё равно запускает ritual.
  #
  # ВАЖНО: некоторые mute-плагины тоже блокируют чат через cancel.
  # Если конкретный mute так работает, эту совместимость нужно отдельно
  # проверить на сервере.
  accept-cancelled-chat: true

  # "Я ТЕБЯ МОГНУ" тоже сработает.
  ignore-case: true

  # Несколько пробелов считаются одним.
  normalize-spaces: true

  # "я тебя могну!", "я тебя могну..." тоже сработают.
  strip-ending-punctuation: true

  # Если true, игроку понадобится permission ниже.
  require-permission: false
  permission-node: "mogritual.use"

  # Если список пустой = разрешены все миры.
  allowed-worlds: []

  # Эти миры всегда запрещены.
  blocked-worlds: []

# ==========================================================
#                       COOLDOWN
# ==========================================================
cooldown:
  # 21600 секунд = 6 часов.
  seconds: 21600

  # PLAYER = cooldown отдельно у каждого участника.
  # GLOBAL = после одного ритуала cooldown на весь сервер.
  # Для логики старой build-roulette рекомендуется PLAYER.
  scope: "PLAYER"

  # SUCCESS = cooldown ставится только после успешной roulette.
  # START   = cooldown ставится сразу при начале ритуала.
  # SUCCESS безопаснее: отменённый ритуал не съедает 6 часов.
  start: "SUCCESS"

  # Сохранять cooldown после рестарта.
  persist: true

  # Игрок с этим permission игнорирует cooldown.
  # Удобно для админского тестирования.
  bypass-permission: "mogritual.cooldown.bypass"

# ==========================================================
#                         RITUAL
# ==========================================================
ritual:
  # 140 ticks = 7 секунд — синхронно с music clip 0:07 → 0:14.
  duration-ticks: 140

  # Камера и блоки обновляются раз в 2 ticks для плавного cinematic движения.
  update-interval-ticks: 2

  title: "&d&lЯ ТЕБЯ МОГНУ"
  subtitle: "&fРитуал начинается..."

  particles:
    enabled: true

    # Вращающийся круг END_ROD.
    ring-points: 12
    ring-radius: 2.6
    ring-height: 0.25
    rotation-speed: 0.08

    # ENCHANT в центре.
    center-enchant-count: 12
    center-spread: 1.6

    # WITCH вокруг каждого участника.
    player-witch-count: 3

  # ========================================================
  # DANCE
  # ========================================================
  dance:
    enabled: true

    # КИНЕМАТОГРАФИЧЕСКАЯ КАМЕРА.
    # Каждый участник видит своего настоящего игрока со стороны.
    camera:
      enabled: true
      radius: 4.6
      height: 2.0
      target-height: 1.15
      bob-amplitude: 0.20
      orbit-speed-radians-per-tick: 0.045
      teleport-duration-ticks: 2

    # Реальные модели двух игроков танцуют и вращаются.
    player-animation:
      enabled: true
      spin-degrees-per-tick: 2.6
      pose-beat-ticks: 8

    # Красивый кастомный gradient-текст.
    text:
      enabled: true
      title-enabled: true
      value: "✦ Я ТЕБЯ МОГНУ ✦"
      start-color: "#ff4fd8"
      end-color: "#7c5cff"
      bold: true

    # РОВНО 3 блока вращаются вокруг КАЖДОГО участника.
    blocks:
      materials:
        - "AMETHYST_BLOCK"
        - "PURPUR_BLOCK"
        - "SEA_LANTERN"
      radius: 1.75
      height: 1.05
      bob-amplitude: 0.35
      rotation-speed: 0.22
      glowing: true

    particles:
      # Частицы обновляются реже камеры, чтобы визуал был плавным без лишней нагрузки.
      refresh-ticks: 4
      spark-count-per-player: 5
      end-rod-count-per-player: 3

  sounds:
    # ------------------------------------------------------
    # CUSTOM SOUND / RESOURCE PACK
    #
    # Сам JAR не содержит песню.
    # Если resource pack содержит нужный звук, вставь его key:
    #
    # custom-key: "custom.ya_tebya_mognu"
    #
    # Если custom-key пустой — используется vanilla fallback.
    # ------------------------------------------------------
    # Sound event из resource-pack template.
    # Файл должен лежать как:
    # assets/mogritual/sounds/ya_tebya_mognu.ogg
    custom-key: "mogritual:ya_tebya_mognu"
    custom-volume: 1.0
    custom-pitch: 1.0

    # false = если custom-key задан, vanilla-звуки НЕ мешают песне.
    vanilla-when-custom-present: false

    vanilla-enabled: true

    # Fallback используется только если custom-key очистить вручную.
    # С resource pack музыка выше запускается синхронно с cinematic dance.
    vanilla-key: "minecraft:block.note_block.harp"
    vanilla-interval-ticks: 5
    vanilla-volume: 0.65
    vanilla-start-pitch: 0.75
    vanilla-end-pitch: 1.65

# ==========================================================
#                        ROULETTE
# ==========================================================
roulette:
  enabled: true

  # EACH = КАЖДЫЙ из участников получает свою отдельную прокрутку.
  # ONE_RANDOM = только один случайный участник получает награду.
  reward-mode: "EACH"

  # Для теста можно поставить false:
  # анимация и результат будут показаны, но reward-команды не выполнятся.
  execute-reward-commands: true

  # Сообщать всему серверу победителей.
  broadcast-winners: false

  # 40 ticks = 2 секунды.
  duration-ticks: 40
  update-interval-ticks: 4

  title: "&d&lЯ ТЕБЯ МОГНУ"
  preview-format: "&7▶ &f%reward% &7◀"

  preview-sound-key: "minecraft:block.note_block.pling"
  preview-sound-volume: 0.35
  preview-pitch-start: 1.0
  preview-pitch-end: 1.8

  final-title: "&d&lЯ ТЕБЯ МОГНУ"
  final-subtitle: "&aВыпало: &f%reward%"
  final-sound-key: "minecraft:entity.player.levelup"
  final-sound-volume: 1.0
  final-sound-pitch: 1.1

  spectator-title: "&d&lЯ ТЕБЯ МОГНУ"
  spectator-subtitle: "&7Сегодня без награды"

# ==========================================================
#                      /mogchance
# ==========================================================
chance-command:
  header: "&d&lMogRitual &f— награды:"

  # %reward% = название
  # %chance% = DISPLAY chance из reward
  # %weight% = реальный weight
  # %actual% = фактический процент, рассчитанный из всех weights
  line: "&7- &f%reward%: &d%chance%% &8(weight %weight%, real %actual%%)"

  # true = показывать фактическую вероятность из weight.
  show-actual-weight-percent: true

# ==========================================================
#                        MESSAGES
# ==========================================================
messages:
  pack-loaded: "&d[MOG] &aМузыкальный resource pack загружен."
  pack-failed: "&d[MOG] &cНе удалось загрузить музыкальный resource pack."
  pack-required: "&d[MOG] &eСначала загрузи музыкальный resource pack и повтори фразу."
  pack-not-configured: "&d[MOG] &cМузыкальный resource pack ещё не настроен администратором."
  pack-sent: "&d[MOG] &fResource pack отправлен. Дождись загрузки и повтори фразу."

  joined: "&d[MOG] &f%player% &7вошёл в ритуал. &f%count%/%required%"
  already-joined: "&d[MOG] &7Ты уже участвуешь в текущем сборе."
  too-far: "&d[MOG] &cНужно быть в радиусе %radius% блоков от остальных участников."
  world-blocked: "&d[MOG] &cВ этом мире ритуал отключён."
  no-permission: "&d[MOG] &cУ тебя нет доступа к этому ритуалу."
  no-admin-permission: "&cНет прав."
  busy: "&d[MOG] &eРитуал уже идёт."
  cooldown: "&d[MOG] &eРитуал снова будет доступен через &f%time%."
  ritual-start: "&d&l[MOG] &fДва игрока завершили фразу. Ритуал начинается..."
  wait-expired: "&d[MOG] &7Второй игрок не успел присоединиться за %seconds% секунд."
  ritual-abort: "&d[MOG] &cРитуал отменён: один из участников вышел или ушёл слишком далеко."
  no-rewards: "&d[MOG] &cВ config.yml нет доступных наград."
  reward: "&d[MOG] &fТебе выпало: &a%reward%"
  spectator: "&d[MOG] &7В режиме ONE_RANDOM награду получил другой участник."
  broadcast-win: "&d[MOG] &f%player% получил &a%reward%&f!"
  reloaded: "&aMogRitual config перезагружен."
  cooldown-reset-all: "&aВсе MogRitual cooldown сброшены."
  cooldown-reset-player: "&aCooldown игрока %player% сброшен."
  player-not-found: "&cИгрок не найден онлайн."
  pending-cleared: "&aСписок ожидающих участников очищен."

# ==========================================================
#                         REWARDS
# ==========================================================
#
# enabled = можно временно отключить конкретную награду.
#
# weight = РЕАЛЬНЫЙ вес при выборе.
# chance = отдельное DISPLAY-значение для /mogchance.
#
# То есть weight и chance специально НЕ обязаны совпадать.
#
# Команды:
#   CONSOLE:<команда>  — команда от консоли
#   PLAYER:<команда>   — команда от игрока
#
# Без префикса команда тоже выполняется от консоли.
#
# Плейсхолдеры:
#   %player%  имя игрока
#   %uuid%    UUID игрока
#   %reward%  ID награды
#
# ВАЖНО:
# PLAYER-команда требует, чтобы игрок был онлайн и имел право
# выполнить соответствующую команду.
#
# Ниже стоят известные команды старой roulette.
# Перед production-релизом SAM-14 сверяет их с фактической
# сборкой сервера.
# ==========================================================
rewards:
  cobra:
    enabled: true
    display-name: "COBRA"
    weight: 25.0
    chance: 25.0
    commands:
      - "CONSOLE:lp user %player% parent add cobra"

  summer:
    enabled: true
    display-name: "SUMMER"
    weight: 0.001
    chance: 0.001
    commands:
      - "CONSOLE:lp user %player% parent add summer"

  pirate:
    enabled: true
    display-name: "PIRATE kit"
    weight: 15.0
    chance: 15.0
    commands:
      - "PLAYER:kit pirat"

  coins:
    enabled: true
    display-name: "150,000 coins"
    weight: 20.0
    chance: 20.0
    commands:
      - "CONSOLE:eco give %player% 150000"

  relics:
    enabled: true
    display-name: "3333 relics"
    weight: 15.0
    chance: 15.0
    commands:
      - "PLAYER:p give 3333"

  dhelper:
    enabled: true
    display-name: "DHELPER kit"
    weight: 35.0
    chance: 35.0
    commands:
      - "PLAYER:kit dhelper"

  owner:
    enabled: true
    display-name: "OWNER"
    weight: 0.00001
    chance: 0.00001
    commands:
      - "CONSOLE:lp user %player% parent add owner"

  loost:
    enabled: true
    display-name: "LOOST kit"
    weight: 10.0
    chance: 10.0
    commands:
      - "PLAYER:kit loost"

  riliks-case:
    enabled: true
    display-name: "RILIKS case"
    weight: 10.0
    chance: 10.0
    commands:
      - "PLAYER:cases give riliks 1"

  kits-case:
    enabled: true
    display-name: "KITS case"
    weight: 20.0
    chance: 20.0
    commands:
      - "PLAYER:cases give kits 1"
