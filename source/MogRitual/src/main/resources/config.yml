    display-name: "PIRATE kit"
    weight: 15.0
    chance: 15.0
    commands:
      - "PLAYER:kit pirat"

  coins:
    enabled: true
    display-name: "150,000 coins"
    weight: 20.0
    chance: 20.0
    commands:
      - "CONSOLE:eco give %player% 150000"

  relics:
    enabled: true
    display-name: "3333 relics"
    weight: 15.0
    chance: 15.0
    commands:
      - "PLAYER:p give 3333"

  dhelper:
    enabled: true
    display-name: "DHELPER kit"
    weight: 35.0
    chance: 35.0
    commands:
      - "PLAYER:kit dhelper"

  owner:
    enabled: true
    display-name: "OWNER"
    weight: 0.00001
    chance: 0.00001
    commands:
      - "CONSOLE:lp user %player% parent add owner"

  loost:
    enabled: true
    display-name: "LOOST kit"
    weight: 10.0
    chance: 10.0
    commands:
      - "PLAYER:kit loost"

  riliks-case:
    enabled: true
    display-name: "RILIKS case"
    weight: 10.0
    chance: 10.0
    commands:
      - "PLAYER:cases give riliks 1"

  kits-case:
    enabled: true
    display-name: "KITS case"
    weight: 20.0
    chance: 20.0
    commands:
      - "PLAYER:cases give kits 1"
